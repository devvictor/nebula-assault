<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- viewport-fit=cover is what makes env(safe-area-inset-*) resolve on notched devices -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#05060d" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Nebula Assault</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #05060d;
        overflow: hidden;
      }
      body {
        overscroll-behavior: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
        -webkit-touch-callout: none;
      }
      /* Phaser injects its canvas here and centres it via the Scale Manager. */
      #app {
        width: 100%;
        height: 100%;
        display: grid;
        place-items: center;
      }
      #app canvas {
        display: block;
        touch-action: none;
      }
      #boot-error {
        display: none;
        position: fixed;
        inset: 0;
        place-items: center;
        color: #ff5c7a;
        font: 14px ui-monospace, Menlo, monospace;
        text-align: center;
        padding: 24px;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="boot-error">Failed to start. Check the console.</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
